domains:
  - id: DOM-001
    name:
      en: Urban Mobility
    description:
      en: Business and operational domain for city transportation services.
    $ref: https://example.org/domains/urban-mobility

datasets:
  - id: DS-001
    name:
      en: Traffic Sensor Observations
    description:
      en: Time-stamped observations from roadside traffic sensors.
    $ref: https://example.org/datasets/traffic-sensor-observations

apis:
  - id: API-001
    name:
      en: Traffic Conditions API
    description:
      en: Service interface for current traffic conditions.
    $ref: https://example.org/apis/traffic-conditions/openapi.yaml

policies:
  - id: POL-001
    name:
      en: Mobility Data Retention Policy
    description:
      en: Policy governing retention of mobility data.
    $ref: https://example.org/policies/mobility-data-retention

workflows:
  - id: WF-001
    name:
      en: Incident Response Workflow
    description:
      en: Operational workflow for responding to major traffic incidents.
    $ref: https://example.org/workflows/incident-response

agents:
  - id: AGENT-001
    name:
      en: Mobility Planning Assistant
    description:
      en: Automation actor that prepares planning recommendations.
    $ref: https://example.org/agents/mobility-planning-assistant

capabilities:
  - id: CAP-001
    name:
      en: Traffic Demand Forecasting
    description:
      en: Capability to forecast traffic demand from historical and current signals.
    $ref: https://example.org/capabilities/traffic-demand-forecasting

strategicOpportunities:
  - id: SO-001
    name:
      en: Event-aware Mobility Planning
    description:
      en: Opportunity to improve mobility planning using event demand signals.
    $ref: https://example.org/opportunities/event-aware-mobility-planning
